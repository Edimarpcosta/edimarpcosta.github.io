<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando — Analítica Política 2026</title>
  <script>
    // GitHub Pages 404 fallback: converte caminho para hash router da SPA
    (function() {
      var path = window.location.pathname;
      var repoMatch = path.match(/^\/([^\/]+)(\/.*)?$/);
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      
      // Se estiver em repositório de projeto
      var basePath = './';
      if (repoMatch) {
        var subPath = repoMatch[2] ? repoMatch[2].replace(/^\//, '') : '';
        if (subPath) {
          window.location.replace(basePath + '#/' + subPath + query + hash);
          return;
        }
      }
      window.location.replace(basePath + query + hash);
    })();
  </script>
  <style>
    body {
      background-color: #0b1120;
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    h1 { color: #f8fafc; font-size: 1.5rem; margin-top: 0; }
    a { color: #38bdf8; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Analítica Política 2026</h1>
    <p>Redirecionando para a aplicação principal...</p>
    <p><a href="./">Clique aqui se não for redirecionado automaticamente</a></p>
  </div>
</body>
</html>
