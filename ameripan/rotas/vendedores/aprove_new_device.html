<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ameripan - Aprovação de Novo Dispositivo</title>
  <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .bg-ameripan { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1e40af 100%); }
    .logo-glow { filter: drop-shadow(0 4px 12px rgba(30, 58, 138, 0.15)); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-100">

  <!-- Modal Central de Loading Bloqueante -->
  <div id="modalLoadingBloqueante" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden transition-all duration-200">
    <div class="bg-white rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-4 max-w-xs w-full mx-4 border border-slate-100 animate-in fade-in zoom-in-95 duration-150">
      <img src="https://cdn.awsli.com.br/400x300/1284/1284671/logo/1e2bc493d1.png" alt="Ameripan" class="h-10 object-contain logo-glow">
      <div class="w-10 h-10 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p id="txtLoadingMsg" class="text-xs font-bold text-slate-700 text-center">Processando autorização...</p>
    </div>
  </div>

  <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 sm:p-8 border border-slate-200/80">
    <!-- Header com Logo Oficial -->
    <div class="flex flex-col items-center justify-center mb-6">
      <div class="p-3 mb-2 flex items-center justify-center">
        <img src="https://cdn.awsli.com.br/400x300/1284/1284671/logo/1e2bc493d1.png" alt="Ameripan Distribuidora" class="h-14 sm:h-16 object-contain logo-glow">
      </div>
      <span class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 text-[11px] font-bold uppercase tracking-wider">
        <i class="ph ph-shield-check text-sm"></i> Controle de Acesso Seguro
      </span>
      <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800 text-center mt-3">Aprovação de Dispositivo</h1>
      <p class="text-slate-500 text-center text-xs mt-1">Homologação de novo smartphone ou terminal do vendedor.</p>
    </div>

    <!-- Card de Dados do Aparelho -->
    <div class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-200/70 space-y-2.5">
      <div class="flex justify-between items-center text-xs">
        <span class="font-medium text-slate-500">Vendedor:</span>
        <span id="lblVendedor" class="font-bold text-slate-800 font-mono bg-white px-2 py-0.5 rounded-md border border-slate-200">--</span>
      </div>
      <div class="flex flex-col gap-1 text-xs">
        <span class="font-medium text-slate-500">Identificador Único (Device ID):</span>
        <span id="lblDevice" class="font-bold text-slate-700 font-mono text-[11px] break-all bg-white p-2 rounded-lg border border-slate-200 select-all">--</span>
      </div>
    </div>

    <!-- Formulário com Senha Mascarada e Zero Plaintext -->
    <form id="formAprovar" class="flex flex-col gap-4">
      <div>
        <label for="txtSenha" class="block text-xs font-bold text-slate-700 mb-1">Senha do Gestor / Supervisão</label>
        <div class="relative">
          <i class="ph ph-lock-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
          <input type="password" id="txtSenha" required autocomplete="current-password"
            class="w-full pl-11 pr-11 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-sm transition-all font-medium text-slate-800"
            placeholder="Digite sua credencial de gestor...">
          <button type="button" id="btnToggleSenha" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1" title="Ver/ocultar senha">
            <i id="iconeToggleSenha" class="ph ph-eye text-lg"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btnAprovar"
        class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2">
        <i class="ph ph-check-circle text-xl"></i>
        <span>Aprovar Acesso Imediato</span>
      </button>
    </form>

    <div id="divMensagem" class="mt-6 hidden p-4 rounded-2xl text-center font-semibold text-xs animate-in fade-in"></div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqKHkBKvl9h9rWestV2NBjTs1ftE_Is-BfEQVAvMds4IfCjF5Q4x6Mt-vdc0nQT2p7ug/exec";

    function exibirLoading(msg) {
      document.getElementById('txtLoadingMsg').textContent = msg || 'Processando...';
      document.getElementById('modalLoadingBloqueante').classList.remove('hidden');
    }

    function ocultarLoading() {
      document.getElementById('modalLoadingBloqueante').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const deviceId = urlParams.get('deviceId');
      const codVendedor = urlParams.get('cod');

      // Toggle visibilidade de senha
      const btnToggle = document.getElementById('btnToggleSenha');
      const txtSenha = document.getElementById('txtSenha');
      const iconeToggle = document.getElementById('iconeToggleSenha');
      btnToggle.addEventListener('click', () => {
        if (txtSenha.type === 'password') {
          txtSenha.type = 'text';
          iconeToggle.className = 'ph ph-eye-slash text-lg';
        } else {
          txtSenha.type = 'password';
          iconeToggle.className = 'ph ph-eye text-lg';
        }
      });

      if (!deviceId || !codVendedor) {
        mostrarErro('Link inválido ou parâmetros ausentes na requisição.');
        document.getElementById('formAprovar').style.display = 'none';
        return;
      }

      document.getElementById('lblVendedor').textContent = codVendedor;
      document.getElementById('lblDevice').textContent = deviceId;

      document.getElementById('formAprovar').addEventListener('submit', async (e) => {
        e.preventDefault();
        const senha = txtSenha.value.trim();
        if (!senha) return;

        const btn = document.getElementById('btnAprovar');
        btn.disabled = true;
        exibirLoading('Autenticando e aprovando dispositivo...');

        try {
          const res = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              acao: 'APROVAR_DISPOSITIVO_RAPIDO',
              codVendedor: codVendedor,
              deviceId: deviceId,
              senhaGestor: senha
            })
          });

          const resText = await res.text();
          let json;
          try {
            json = JSON.parse(resText);
          } catch (e) {
            throw new Error("Resposta inválida recebida do servidor.");
          }

          if (json.sucesso) {
            mostrarSucesso('Dispositivo homologado com sucesso! O vendedor já pode acessar sua rota.');
            document.getElementById('formAprovar').style.display = 'none';
          } else {
            mostrarErro('Falha: ' + (json.erro || 'Não autorizado'));
          }
        } catch (err) {
          mostrarErro('Erro de conexão com o servidor da Ameripan. Tente novamente.');
        } finally {
          ocultarLoading();
          btn.disabled = false;
        }
      });
    });

    function mostrarErro(msg) {
      const div = document.getElementById('divMensagem');
      div.className = 'mt-6 p-4 rounded-2xl text-center font-semibold text-xs bg-red-50 text-red-700 border border-red-200';
      div.innerHTML = `<div class="flex items-center justify-center gap-1.5"><i class="ph ph-warning-circle text-base"></i><span>${msg}</span></div>`;
      div.classList.remove('hidden');
    }

    function mostrarSucesso(msg) {
      const div = document.getElementById('divMensagem');
      div.className = 'mt-6 p-4 rounded-2xl text-center font-semibold text-xs bg-emerald-50 text-emerald-700 border border-emerald-200';
      div.innerHTML = `<div class="flex items-center justify-center gap-1.5"><i class="ph ph-check-circle text-base"></i><span>${msg}</span></div>`;
      div.classList.remove('hidden');
    }
  </script>
</body>
</html>
