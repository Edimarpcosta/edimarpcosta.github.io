<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aprovação de Novo Dispositivo</title>
  <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 sm:p-8">
    <div class="flex justify-center mb-6">
      <div class="bg-blue-100 p-4 rounded-full">
        <i class="ph ph-device-mobile text-4xl text-blue-600"></i>
      </div>
    </div>
    
    <h1 class="text-2xl font-bold text-slate-800 text-center mb-2">Aprovar Dispositivo</h1>
    <p class="text-slate-500 text-center mb-8 text-sm">Um novo aparelho está tentando acessar o sistema.</p>

    <div class="bg-slate-50 p-4 rounded-lg mb-6 border border-slate-200">
      <div class="flex flex-col gap-2 text-sm">
        <div class="flex justify-between">
          <span class="font-medium text-slate-600">Vendedor ID:</span>
          <span id="lblVendedor" class="font-semibold text-slate-800 font-mono">--</span>
        </div>
        <div class="flex justify-between items-center gap-4">
          <span class="font-medium text-slate-600">Device ID:</span>
          <span id="lblDevice" class="font-semibold text-slate-800 font-mono text-xs break-all text-right">--</span>
        </div>
      </div>
    </div>

    <form id="formAprovar" class="flex flex-col gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Senha do Gestor</label>
        <div class="relative">
          <i class="ph ph-lock-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="password" id="txtSenha" required
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
            placeholder="Digite sua senha...">
        </div>
      </div>

      <button type="submit" id="btnAprovar"
        class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
        <i class="ph ph-check-circle text-xl"></i>
        <span>Aprovar Acesso</span>
      </button>
    </form>

    <div id="divMensagem" class="mt-6 hidden p-4 rounded-xl text-center font-medium text-sm"></div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqKHkBKvl9h9rWestV2NBjTs1ftE_Is-BfEQVAvMds4IfCjF5Q4x6Mt-vdc0nQT2p7ug/exec";

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const deviceId = urlParams.get('deviceId');
      const codVendedor = urlParams.get('cod');

      if (!deviceId || !codVendedor) {
        mostrarErro('Link inválido. Parâmetros ausentes.');
        document.getElementById('formAprovar').style.display = 'none';
        return;
      }

      document.getElementById('lblVendedor').textContent = codVendedor;
      document.getElementById('lblDevice').textContent = deviceId;

      document.getElementById('formAprovar').addEventListener('submit', async (e) => {
        e.preventDefault();
        const senha = document.getElementById('txtSenha').value.trim();
        if (!senha) return;

        const btn = document.getElementById('btnAprovar');
        btn.disabled = true;
        btn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> Processando...';

        try {
          const res = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
              acao: 'APROVAR_DISPOSITIVO_RAPIDO',
              dados: {
                codVendedor: codVendedor,
                deviceId: deviceId,
                senhaGestor: senha
              }
            })
          });

          const json = await res.json();
          if (json.sucesso) {
            mostrarSucesso('Dispositivo aprovado com sucesso! O vendedor já pode logar.');
            document.getElementById('formAprovar').style.display = 'none';
          } else {
            mostrarErro('Erro: ' + (json.erro || 'Desconhecido'));
          }
        } catch (err) {
          mostrarErro('Erro de conexão. Tente novamente.');
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="ph ph-check-circle text-xl"></i> Aprovar Acesso';
        }
      });
    });

    function mostrarErro(msg) {
      const div = document.getElementById('divMensagem');
      div.className = 'mt-6 p-4 rounded-xl text-center font-medium text-sm bg-red-50 text-red-600 border border-red-200';
      div.textContent = msg;
      div.classList.remove('hidden');
    }

    function mostrarSucesso(msg) {
      const div = document.getElementById('divMensagem');
      div.className = 'mt-6 p-4 rounded-xl text-center font-medium text-sm bg-emerald-50 text-emerald-600 border border-emerald-200';
      div.textContent = msg;
      div.classList.remove('hidden');
    }
  </script>
</body>
</html>
